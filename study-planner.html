<body>

  <h1>Planner</h1>

  <div class="input-section">
    <select id="day-select">
      <option value="" disabled selected>Select a day</option>
      <option>Monday</option>
      <option>Tuesday</option>
      <option>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
      <option>Saturday</option>
      <option>Sunday</option>
    </select>
    <input type="text" id="task-input" placeholder="Enter your task..." />
    <button id="add-task">Add</button>
  </div>

  <div class="tasks-container" id="tasks-container">
    <!-- Tasks organized by day will appear here -->
  </div>

  <div id="pomodoro">
    <div id="pomodoro-time">25:00</div>
    <button id="start-stop">Start</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    const tasksByDay = JSON.parse(localStorage.getItem('plannerTasks')) || {};
    const tasksContainer = document.getElementById('tasks-container');
    const daySelect = document.getElementById('day-select');
    const taskInput = document.getElementById('task-input');
    const addTaskBtn = document.getElementById('add-task');

    function renderTasks() {
      tasksContainer.innerHTML = '';
      Object.keys(tasksByDay).forEach(day => {
        const section = document.createElement('div');
        section.className = 'day-section';
        section.innerHTML = `<h2>${day}</h2><ul id="${day}-ul"></ul>`;
        const ul = section.querySelector('ul');

        tasksByDay[day].forEach(task => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${task}</span><button class="delete">&times;</button>`;
          li.querySelector('button').addEventListener('click', () => {
            tasksByDay[day] = tasksByDay[day].filter(t => t !== task);
            saveTasks();
            renderTasks();
          });
          ul.appendChild(li);
        });

        tasksContainer.appendChild(section);
      });
    }

    function saveTasks() {
      localStorage.setItem('plannerTasks', JSON.stringify(tasksByDay));
    }

    addTaskBtn.addEventListener('click', () => {
      const day = daySelect.value;
      const task = taskInput.value.trim();
      if (!day || task === '') return;

      if (!tasksByDay[day]) tasksByDay[day] = [];
      tasksByDay[day].push(task);
      saveTasks();
      renderTasks();
      taskInput.value = '';
    });

// Pomodoro Timer
let pomodoroTime = 25 * 60;
let running = false;
let interval;

const timeDisplay = document.getElementById('pomodoro-time');
const startStopBtn = document.getElementById('start-stop');
const resetBtn = document.getElementById('reset');

function updateTime() {
  const mins = Math.floor(pomodoroTime / 60);
  const secs = pomodoroTime % 60;
  timeDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function togglePomodoro() {
  if (!running) {
    interval = setInterval(() => {
      if (pomodoroTime > 0) {
        pomodoroTime--;
        updateTime();
      } else {
        clearInterval(interval);
        startStopBtn.textContent = 'Start';
        running = false;
        alert('Pomodoro complete! Take a break.');
      }
    }, 1000);
    startStopBtn.textContent = 'Pause';
    running = true;
  } else {
    clearInterval(interval);
    startStopBtn.textContent = 'Start';
    running = false;
  }
}

function resetPomodoro() {
  clearInterval(interval);
  pomodoroTime = 25 * 60;
  updateTime();
  startStopBtn.textContent = 'Start';
  running = false;
}

startStopBtn.addEventListener('click', togglePomodoro);
resetBtn.addEventListener('click', resetPomodoro);
updateTime();

// Make Pomodoro draggable within window bounds
const pomodoro = document.getElementById('pomodoro');
let offsetX, offsetY, dragging = false;

pomodoro.addEventListener('mousedown', (e) => {
  dragging = true;
  offsetX = e.clientX - pomodoro.offsetLeft;
  offsetY = e.clientY - pomodoro.offsetTop;
  pomodoro.style.cursor = 'grabbing';
});

document.addEventListener('mousemove', (e) => {
  if (dragging) {
    let newX = e.clientX - offsetX;
    let newY = e.clientY - offsetY;

    // Clamp to window boundaries
    const maxX = window.innerWidth - pomodoro.offsetWidth;
    const maxY = window.innerHeight - pomodoro.offsetHeight;

    newX = Math.max(0, Math.min(newX, maxX));
    newY = Math.max(0, Math.min(newY, maxY));

    pomodoro.style.left = `${newX}px`;
    pomodoro.style.top = `${newY}px`;
    pomodoro.style.position = 'fixed';
  }
});

document.addEventListener('mouseup', () => {
  dragging = false;
  pomodoro.style.cursor = 'grab';
});
