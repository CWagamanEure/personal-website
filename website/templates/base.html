<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}Cory Wagaman-Eure's personal website.{% endblock %}">
    <title>{% block title %}Cory Wagaman-Eure{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='images/website-logo.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    {% block styles %}{% endblock %}
    {% block head_scripts %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
