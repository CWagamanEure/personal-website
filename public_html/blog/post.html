<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog — Cory Wagaman-Eure</title>

  <link rel="stylesheet" href="../style.css" />

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- KaTeX (math) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>

<body>
  <main>
    <section class="sub-hero">
      <div class="sub-hero-inner">
        <a class="crumb" href="/blog/">← Back to Blog</a>
        <h1 class="lab-title" id="postTitle">Loading…</h1>
        <p class="lab-subtitle" id="postSubtitle"></p>
      </div>
    </section>

    <section style="padding-top: 60px;">
      <article class="entry" id="content">Loading…</article>
    </section>
  </main>

  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const file = params.get("file"); // e.g. my-post.md
      const contentEl = document.getElementById("content");

      if (!file) {
        contentEl.textContent = "Missing ?file=...";
        return;
      }

      const res = await fetch(`/blog/posts/${file}`);
      if (!res.ok) throw new Error("Fetch failed");
      const md = await res.text();

      const titleMatch = md.match(/^#\s+(.+)$/m);
      document.getElementById("postTitle").textContent =
        titleMatch ? titleMatch[1] : "Blog Post";

      // 1) Render markdown to HTML
      contentEl.innerHTML = marked.parse(md);

      // 2) Render math in the generated HTML (KaTeX auto-render)
      if (window.renderMathInElement) {
        window.renderMathInElement(contentEl, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },

            // Optional: enable inline $...$ (can conflict with $ currency)
            { left: "$", right: "$", display: false },
          ],
          throwOnError: false,
        });
      }
    }

    // Wait for deferred KaTeX scripts to be available
    window.addEventListener("load", () => {
      loadPost().catch(() => {
        document.getElementById("content").textContent = "Error loading post.";
      });
    });
  </script>
</body>
</html>
