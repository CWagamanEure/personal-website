<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Market Microstructure — Lab</title>
  <link rel="stylesheet" href="../style.css"/>

  <style>
    /* Page-local polish */
    .lab-wrap{max-width:900px;margin:0 auto;padding:64px 20px}
    .crumb{color:#a7ffeb;text-decoration:none;font-size:.95rem}
    .crumb:hover{text-decoration:underline}
    .lab-title{font-size:2.2rem;margin:10px 0 6px}
    .lab-sub{color:#b8c7e0;margin:0 0 18px}

    .grid{display:grid;gap:16px;grid-template-columns:1fr}
    @media (min-width:900px){ .grid{grid-template-columns:1fr 1fr 1fr} }

    .card{
      background:#0a192f;border:1px solid #2d4a68;border-radius:14px;
      padding:18px 16px; display:flex; flex-direction:column; gap:12px
    }
    .card h2{margin:0;color:#64ffda;font-size:1.15rem}
    .muted{opacity:.85;font-size:.9rem}
    .list{display:flex;flex-direction:column;gap:10px}
    .item-title{margin:0}
    .item-title a{color:#ccd6f6;text-decoration:none}
    .item-title a:hover{text-decoration:underline}
    .meta{font-size:.85rem;opacity:.85}
    .cta-row{display:flex;gap:10px;margin-top:auto}
    .pill{padding:8px 12px;border-radius:10px;border:1px solid #2d4a68;text-decoration:none;color:#ccd6f6}
    .pill:hover{background:#2d4a68}
    .footer-note{margin-top:24px;text-align:center;color:#90a4ae;font-size:.85rem}
  </style>
</head>
<body>
  <main class="lab-wrap">
    <a class="crumb" href="../">← Home</a>
    <h1 class="lab-title">Market Microstructure Lab</h1>
    <p class="lab-sub">Latest notes, active projects, and papers I’m digesting.</p>

    <!-- Quick nav -->
    <p class="cta-row" style="margin-bottom:14px">
      <a class="study-btn" href="journal.html">Journal</a>
      <a class="study-btn" href="projects.html">Projects</a>
      <a class="study-btn" href="literature.html">Relevant Literature</a>
    </p>

    <!-- Three columns -->
    <section class="grid">
      <!-- Journal -->
      <div class="card" id="card-journal">
        <div>
          <h2>Journal</h2>
          <div class="muted" id="j-count">—</div>
        </div>
        <div class="list" id="j-list">
          <!-- injected -->
        </div>
        <div class="cta-row">
          <a class="pill" href="journal.html">View all</a>
        </div>
      </div>

      <!-- Projects -->
      <div class="card" id="card-projects">
        <div>
          <h2>Projects</h2>
          <div class="muted" id="p-count">—</div>
        </div>
        <div class="list" id="p-list">
          <!-- injected -->
        </div>
        <div class="cta-row">
          <a class="pill" href="projects.html">View all</a>
        </div>
      </div>

      <!-- Literature -->
      <div class="card" id="card-lit">
        <div>
          <h2>Relevant Literature</h2>
          <div class="muted" id="l-count">—</div>
        </div>
        <div class="list" id="l-list">
          <!-- injected -->
        </div>
        <div class="cta-row">
          <a class="pill" href="literature.html">View all</a>
        </div>
      </div>
    </section>

    <div class="footer-note">Last updated: <span id="last-updated">—</span></div>
  </main>

  <script src="data.js"></script>
  <script>
    // ---- tiny renderer (no frameworks) ----
    const data = window.MMLAB || {journal:[], projects:[], literature:[]};

    const fmt = d => (d||'').slice(0,10);
    const byDateDesc = (a,b) => (b.date||'').localeCompare(a.date||'');

    function setCount(id, arr, noun){
      const el = document.getElementById(id);
      el.textContent = `${arr.length} ${noun}${arr.length===1?'':'s'}`;
    }

    function injectList(containerId, arr, limit, builder){
      const root = document.getElementById(containerId);
      root.innerHTML = '';
      arr.slice(0, limit).forEach(item => root.appendChild(builder(item)));
      if (!arr.length){
        const p = document.createElement('p');
        p.className = 'muted';
        p.textContent = 'No entries yet — add one in data.js';
        root.appendChild(p);
      }
    }

    function itemEl({title, link, date, summary, meta}){
      const wrap = document.createElement('div');
      const h = document.createElement('p');
      h.className = 'item-title';
      h.innerHTML = link ? `<a href="${link}" target="_blank" rel="noopener">${title}</a>` : title;
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = [fmt(date), meta].filter(Boolean).join(' • ');
      const s = document.createElement('p'); s.textContent = summary || '';
      wrap.appendChild(h); wrap.appendChild(m); if(summary) wrap.appendChild(s);
      return wrap;
    }

    // Sort & render
    data.journal.sort(byDateDesc);
    data.projects.sort(byDateDesc);
    data.literature.sort(byDateDesc);

    setCount('j-count', data.journal, 'entry');
    setCount('p-count', data.projects, 'project');
    setCount('l-count', data.literature, 'paper');

    injectList('j-list', data.journal, 3, i => itemEl({
      title: i.title, link: (i.links?.[0]?.url||''), date: i.date, summary: i.summary
    }));

    injectList('p-list', data.projects, 2, i => itemEl({
      title: i.title, link: (i.links?.[0]?.url||''), date: i.date,
      summary: i.summary, meta: i.status ? `status: ${i.status}` : ''
    }));

    injectList('l-list', data.literature, 3, i => itemEl({
      title: i.cite || i.title, link: i.link, date: i.date, summary: i.takeaway
    }));

    // Last updated = max date across all
    const dates = [...data.journal, ...data.projects, ...data.literature]
      .map(x => x.date).filter(Boolean).sort().reverse();
    document.getElementById('last-updated').textContent = dates[0] ? fmt(dates[0]) : '—';
  </script>
</body>
</html>
